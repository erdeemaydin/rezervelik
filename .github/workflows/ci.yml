name: CI

# The "before it can reach production" gate: both jobs must pass on every PR and
# on pushes to main. See docs/TESTING_AND_CICD.md for the full strategy.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (unit + API integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Provision isolated test database
        run: npm run test:setup-db
      - name: Run tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint + types + unit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
