version: 2

# Automated dependency-update PRs. This is a scheduled, ongoing complement to
# the `npm audit` CI gate (ci.yml) — `npm audit` catches a vulnerability
# whenever a PR/push happens to run CI; Dependabot proactively opens a PR the
# moment an advisory is published (or on the weekly schedule for routine
# version bumps), even if nobody touches this repo that day. See
# docs/planning/PRODUCTION_ROADMAP.md §11 for the fuller writeup.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "backend"]
    groups:
      # Security patches land as individual, easy-to-review PRs; routine
      # minor/patch version bumps are batched so they don't flood the PR list.
      backend-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades are done deliberately, not by automated PRs: next and
      # its eslint config move together, and prisma, typescript and vitest
      # majors need code changes. Minor and patch releases still surface.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "frontend"]
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades are done deliberately, not by automated PRs: next and
      # its eslint config move together, and prisma, typescript and vitest
      # majors need code changes. Minor and patch releases still surface.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
