version: 2

# Automated dependency-update PRs. This is a scheduled, ongoing complement to
# the `npm audit` CI gate (ci.yml) — `npm audit` catches a vulnerability
# whenever a PR/push happens to run CI; Dependabot proactively opens a PR the
# moment an advisory is published (or on the weekly schedule for routine
# version bumps), even if nobody touches this repo that day. See
# docs/planning/PRODUCTION_ROADMAP.md §11 for the fuller writeup.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "backend"]
    groups:
      # Security patches land as individual, easy-to-review PRs; routine
      # minor/patch version bumps are batched so they don't flood the PR list.
      backend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "frontend"]
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # next.js is upgraded deliberately, not automatically — see
      # frontend/AGENTS.md ("this is NOT the Next.js you know", breaking
      # changes vs. training-data assumptions) and docs/planning/PRODUCTION_ROADMAP.md §11.
      # A Dependabot PR still opens for it (major/minor/patch all excluded
      # here would hide even patch releases); this only blocks *major* auto-PRs
      # so 16.x patch releases (which may carry security fixes, e.g. the
      # postcss/sharp advisories currently pending) still surface normally.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
